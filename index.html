<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b1b1e">
  <meta name="description" content="Automated daily digest tracking the AI open-source ecosystem — issues, PRs, releases, community signals.">
  <title>alex-radar</title>
  <link rel="icon" type="image/png" href="https://github.com/yaojiejia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="alternate" type="application/rss+xml" title="alex-radar RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    /* ── Chirpy dark palette (matches jekyll-theme-chirpy dark tokens) ── */
    :root {
      color-scheme: dark;
      --main-bg: rgb(27 27 30);
      --main-border-color: rgb(44 45 45);
      --text-color: rgb(175 176 177);
      --text-muted-color: #868686;
      --text-muted-highlight-color: #aeaeae;
      --heading-color: #cccccc;
      --blockquote-border-color: rgb(66 66 66);
      --blockquote-text-color: #868686;
      --link-color: rgb(138 180 248);
      --link-underline-color: rgb(82 108 150);
      --button-bg: #1e1e1e;
      --btn-border-color: #2e2f31;
      --card-bg: #1e1e1e;
      --card-hover-bg: #464d51;
      --card-header-bg: #292929;
      --site-title-color: #b8b8b8;
      --site-subtitle-color: #868686;
      --sidebar-bg: #1e1e1e;
      --sidebar-border-color: #292929;
      --sidebar-muted-color: #868686;
      --sidebar-active-color: rgb(255 255 255 / 95%);
      --sidebar-hover-bg: #262626;
      --avatar-border-color: rgb(206 206 206 / 90%);
      --topbar-bg: rgb(27 27 30 / 64%);
      --search-border-color: rgb(55 55 55);
      --search-icon-color: rgb(100 102 105);
      --input-focus-border-color: rgb(112 114 115);
      --btn-paginator-hover-color: #2e2e2e;
      --tag-hover: rgb(43 56 62);
      --tb-odd-bg: #252526;
      --tb-even-bg: rgb(31 31 34);
      --mask-bg: rgb(68 69 70);
      --sidebar-width: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--main-bg);
      color: var(--text-color);
      font-family: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 1rem;
      line-height: 1.6;
    }
    a { color: var(--link-color); text-decoration: none; }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%;
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border-color);
      overflow-y: auto;
      scrollbar-width: none;
      display: flex; flex-direction: column; align-items: flex-end;
      z-index: 50;
      transition: transform 0.4s ease;
    }
    #sidebar::-webkit-scrollbar { display: none; }
    .profile-wrapper {
      padding: 2.5rem 1.25rem 0 2.5rem;
      margin-bottom: 1rem;
      width: 100%;
    }
    #avatar {
      display: block; width: 7rem; height: 7rem;
      border-radius: 50%; overflow: hidden;
      box-shadow: var(--avatar-border-color) 0 0 0 2px;
      transform: translateZ(0);
    }
    #avatar img { width: 100%; height: 100%; display: block; transition: transform 0.5s; }
    #avatar img:hover { transform: scale(1.2); }
    .site-title {
      font-weight: 900; font-size: 1.75rem; line-height: 1.2;
      letter-spacing: 0.25px;
      margin-top: 1.25rem; margin-bottom: 0.25rem;
      width: fit-content;
      color: var(--site-title-color);
    }
    .site-title:hover { color: var(--sidebar-active-color); }
    .site-radar-name {
      font-size: 0.95rem; font-weight: 600;
      color: var(--text-muted-highlight-color);
      margin-bottom: 0.25rem;
    }
    .site-subtitle {
      font-size: 95%; font-style: italic;
      color: var(--site-subtitle-color);
      word-spacing: 1px;
      user-select: none;
    }
    #sidebar nav { width: 100%; flex-grow: 1; }
    #sidebar ul { list-style: none; }
    #sidebar .nav-item { opacity: 0.9; width: 100%; padding: 0 1.5rem; }
    #sidebar .nav-link {
      display: flex; align-items: center; gap: 0.85rem;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      color: var(--sidebar-muted-color);
      font-size: 0.95rem; font-weight: 600; letter-spacing: 1px;
      transition: background 0.2s, color 0.2s;
    }
    #sidebar .nav-item.active .nav-link,
    #sidebar .nav-link:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-active-color); }
    #sidebar .nav-link i { width: 1.1rem; text-align: center; }
    .sidebar-bottom {
      display: flex; align-items: center; gap: 0.4rem;
      width: 100%; padding: 1rem 2rem 2rem;
    }
    .sidebar-bottom a {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 50%;
      color: var(--sidebar-muted-color); font-size: 1.05rem;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar-bottom a:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-active-color); }

    /* ── Main wrapper ── */
    #main-wrapper {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    #main {
      width: 100%; max-width: 1000px;
      margin: 0 auto;
      padding: 0 3rem 3rem;
      flex-grow: 1;
    }

    /* ── Topbar ── */
    #topbar-wrapper {
      position: sticky; top: 0; z-index: 40;
      height: 3rem;
      background: var(--topbar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #topbar {
      max-width: 1000px; margin: 0 auto; height: 100%;
      padding: 0 3rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    #breadcrumb { font-size: 0.9rem; color: var(--text-muted-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #breadcrumb a { color: var(--text-muted-color); }
    #breadcrumb a:hover { color: var(--link-color); }
    #breadcrumb .sep { margin: 0 0.4rem; opacity: 0.6; }
    #sidebar-trigger {
      display: none;
      background: none; border: none; color: var(--text-color);
      font-size: 1.1rem; cursor: pointer; padding: 0.4rem;
    }
    #search {
      display: flex; align-items: center; gap: 0.5rem;
      border: 1px solid var(--search-border-color);
      border-radius: 1rem;
      background: var(--main-bg);
      padding: 0 0.75rem;
      height: 1.9rem; width: 240px;
      flex-shrink: 0;
    }
    #search i { color: var(--search-icon-color); font-size: 0.8rem; }
    #search input {
      background: none; border: none; outline: none;
      color: var(--text-color); font-family: inherit; font-size: 0.9rem;
      width: 100%;
    }
    #search input::placeholder { color: var(--search-icon-color); }
    #search:focus-within { border-color: var(--input-focus-border-color); }

    /* ── Post list (home) ── */
    #post-list { margin-top: 2rem; }
    .search-status { font-size: 0.85rem; color: var(--text-muted-color); margin-bottom: 1rem; min-height: 1.2rem; }
    .card-wrapper {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--main-border-color);
      border-radius: 0.625rem;
      box-shadow: 0 0 5px 0 rgb(0 0 0 / 15%);
      transition: box-shadow 0.2s ease-in-out, border-color 0.2s;
      color: inherit;
    }
    .card-wrapper:not(:last-child) { margin-bottom: 1.25rem; }
    .card-wrapper:hover { border-color: var(--card-hover-bg); box-shadow: 0 0 8px 0 rgb(0 0 0 / 35%); }
    .card-body { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; }
    .card-title {
      color: var(--heading-color);
      font-size: 1.25rem; font-weight: 600; line-height: 1.35;
      margin: 0.25rem 0 0.5rem;
      display: -webkit-box; overflow: hidden; text-overflow: ellipsis;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .card-text {
      color: var(--text-color); font-size: 0.95rem;
      margin-bottom: 0.85rem;
      display: -webkit-box; overflow: hidden; text-overflow: ellipsis;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      min-height: 2.4em;
    }
    .post-meta { font-size: 0.85rem; color: var(--text-muted-color); }
    .post-meta i { margin-right: 0.35rem; }
    .post-meta .categories { margin-left: 0; }
    .post-meta > span + i { margin-left: 1.1rem; }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      list-style: none; margin-top: 2rem;
    }
    .page-link {
      display: flex; align-items: center; justify-content: center;
      min-width: 2.1rem; height: 2.1rem; padding: 0 0.5rem;
      border-radius: 0.5rem;
      color: var(--text-color); font-size: 0.95rem;
      cursor: pointer; background: none; border: none; font-family: inherit;
      transition: background 0.2s;
    }
    .page-link:hover { background: var(--btn-paginator-hover-color); }
    .page-item.active .page-link { background: var(--btn-paginator-hover-color); color: var(--sidebar-active-color); font-weight: 700; }
    .page-item.disabled .page-link { opacity: 0.35; cursor: default; }
    .page-item.disabled .page-link:hover { background: none; }

    /* ── Day (post) view ── */
    #post-view { margin-top: 2rem; }
    .post-title {
      color: var(--heading-color);
      font-size: 1.9rem; font-weight: 700; line-height: 1.25;
      margin-bottom: 0.6rem;
    }
    .post-desc { font-size: 0.9rem; color: var(--text-muted-color); margin-bottom: 1.25rem; }
    .post-desc i { margin-right: 0.35rem; }

    /* report tabs — the day's reports, styled like Chirpy post tags */
    .report-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.75rem; }
    .report-tab {
      background: var(--button-bg);
      border: 1px solid var(--btn-border-color);
      border-radius: 0.8rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem; font-family: inherit;
      color: var(--text-muted-highlight-color);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .report-tab:hover { background: var(--tag-hover); }
    .report-tab.active {
      background: var(--btn-paginator-hover-color);
      border-color: var(--btn-paginator-hover-color);
      color: var(--sidebar-active-color);
      font-weight: 600;
    }

    /* ── Markdown content (Chirpy post typography) ── */
    .post-content { font-size: 1.05rem; line-height: 1.75; overflow-wrap: break-word; }
    .post-content > *:first-child { margin-top: 0; }
    .post-content h1, .post-content h2, .post-content h3, .post-content h4 {
      color: var(--heading-color); font-weight: 600;
      margin: 2rem 0 1rem;
      scroll-margin-top: 3.5rem;
    }
    .post-content h1 { font-size: 1.6rem; }
    .post-content h2 { font-size: 1.35rem; }
    .post-content h3 { font-size: 1.15rem; }
    .post-content h4 { font-size: 1.05rem; }
    .post-content p { margin-bottom: 1rem; }
    .post-content a { border-bottom: 1px solid var(--link-underline-color); }
    .post-content a:hover { color: #f8f8f8; border-bottom-color: var(--link-color); }
    .post-content ul, .post-content ol { margin: 0 0 1rem 1.5rem; }
    .post-content li { margin-bottom: 0.3rem; }
    .post-content strong { color: var(--text-muted-highlight-color); }
    .post-content em { color: var(--text-muted-color); }
    .post-content hr { border: 0; border-top: 1px solid var(--main-border-color); margin: 2rem 0; }
    .post-content blockquote {
      border-left: 5px solid var(--blockquote-border-color);
      color: var(--blockquote-text-color);
      padding-left: 1rem; margin: 0 0 1rem;
    }
    .post-content code {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.85em;
      background: var(--card-header-bg);
      color: #c9c9c9;
      padding: 0.15em 0.4em; border-radius: 4px;
    }
    .post-content pre {
      background: var(--tb-even-bg);
      border: 1px solid var(--main-border-color);
      border-radius: 0.375rem;
      padding: 1rem; margin-bottom: 1rem;
      overflow-x: auto;
    }
    .post-content pre code { background: none; padding: 0; }
    .post-content img { max-width: 100%; border-radius: 0.375rem; }
    .post-content .table-wrap { overflow-x: auto; margin-bottom: 1rem; }
    .post-content table {
      border-collapse: collapse; width: 100%;
      font-size: 0.92rem;
    }
    .post-content th, .post-content td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--tb-odd-bg);
      text-align: left; white-space: nowrap;
    }
    .post-content td:last-child, .post-content th:last-child { white-space: normal; min-width: 200px; }
    .post-content thead th { color: var(--heading-color); border-bottom: 1px solid var(--mask-bg); }
    .post-content tbody tr:nth-child(odd) { background: var(--tb-odd-bg); }
    .post-content tbody tr:nth-child(even) { background: var(--tb-even-bg); }
    .post-content details {
      background: var(--card-bg);
      border: 1px solid var(--main-border-color);
      border-radius: 0.375rem;
      padding: 0.75rem 1rem; margin-bottom: 1rem;
    }
    .post-content summary { cursor: pointer; color: var(--heading-color); font-weight: 600; }

    /* ── Misc ── */
    .msg { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 5rem 0; color: var(--text-muted-color); }
    .msg-icon { font-size: 2rem; }
    .fade { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    #mask {
      display: none; position: fixed; inset: 0;
      background: rgb(0 0 0 / 40%); z-index: 45;
    }
    body.sidebar-open #mask { display: block; }

    /* ── Responsive ── */
    @media (max-width: 1199px) { #main, #topbar { padding-left: 2rem; padding-right: 2rem; } }
    @media (max-width: 849px) {
      #sidebar { transform: translateX(calc(var(--sidebar-width) * -1)); }
      body.sidebar-open #sidebar { transform: none; }
      #main-wrapper { margin-left: 0; }
      #sidebar-trigger { display: block; }
      #main, #topbar { padding-left: 1rem; padding-right: 1rem; }
      #search { width: 160px; }
      .post-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<aside id="sidebar" aria-label="Sidebar">
  <header class="profile-wrapper">
    <a href="#" id="avatar" aria-label="Home"><img src="https://github.com/yaojiejia.png" alt="avatar"></a>
    <a class="site-title" href="#" style="display:block">alex-radar</a>
    <p class="site-radar-name">the AI Ecosystem Radar</p>
    <p class="site-subtitle">Daily intelligence on the AI open-source ecosystem</p>
  </header>
  <nav>
    <ul class="nav">
      <li class="nav-item active" id="nav-home">
        <a href="#" class="nav-link"><i class="fa-fw fas fa-home"></i><span>HOME</span></a>
      </li>
      <li class="nav-item">
        <a href="https://github.com/yaojiejia/agents-radar" target="_blank" rel="noopener noreferrer" class="nav-link"><i class="fa-fw fab fa-github"></i><span>GITHUB</span></a>
      </li>
      <li class="nav-item">
        <a href="./feed.xml" class="nav-link"><i class="fa-fw fas fa-rss"></i><span>RSS</span></a>
      </li>
    </ul>
  </nav>
  <div class="sidebar-bottom">
    <a href="https://github.com/yaojiejia" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile"><i class="fab fa-github"></i></a>
    <a href="./feed.xml" aria-label="RSS"><i class="fas fa-rss"></i></a>
  </div>
</aside>

<div id="mask"></div>

<div id="main-wrapper">
  <header id="topbar-wrapper" aria-label="Top Bar">
    <div id="topbar">
      <button type="button" id="sidebar-trigger" aria-label="Sidebar"><i class="fas fa-bars fa-fw"></i></button>
      <nav id="breadcrumb" aria-label="Breadcrumb"><span>Home</span></nav>
      <search id="search">
        <i class="fas fa-search fa-fw"></i>
        <input id="search-input" type="search" aria-label="search" autocomplete="off" placeholder="Search...">
      </search>
    </div>
  </header>

  <main id="main">
    <div id="content">
      <div class="msg"><div class="msg-icon">📡</div><div>Loading…</div></div>
    </div>
  </main>
</div>

<script>
marked.use({ breaks: true, gfm: true });

// Allow <details> and <summary> which DOMPurify strips by default
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') {
    data.allowedTags[data.tagName] = true;
  }
});

function renderMarkdown(raw) {
  const html = marked.parse(raw);
  return DOMPurify.sanitize(html, {
    ADD_TAGS: ['details', 'summary'],
    ADD_ATTR: ['open'],
  });
}

const LABELS = {
  'ai-digest':       'AI Ecosystem Digest',
  'ai-cli':          'AI CLI Tools',
  'ai-cli-en':       'AI CLI Tools',
  'ai-agents':       'AI Agents Ecosystem',
  'ai-agents-en':    'AI Agents Ecosystem',
  'ai-infra':        'AI Infrastructure',
  'ai-infra-en':     'AI Infrastructure',
  'ai-web':          'OpenAI & Anthropic Updates',
  'ai-web-en':       'OpenAI & Anthropic Updates',
  'ai-trending':     'GitHub AI Trends',
  'ai-trending-en':  'GitHub AI Trends',
  'ai-hn':           'HN Community Digest',
  'ai-hn-en':        'HN Community Digest',
  'ai-ph':           'Product Hunt AI',
  'ai-ph-en':        'Product Hunt AI',
  'ai-arxiv':        'ArXiv AI Research',
  'ai-arxiv-en':     'ArXiv AI Research',
  'ai-hf':           'HF Trending Models',
  'ai-hf-en':        'HF Trending Models',
  'ai-community':    'Tech Community AI',
  'ai-community-en': 'Tech Community AI',
  'ai-weekly':       'Weekly Digest',
  'ai-weekly-en':    'Weekly Digest',
  'ai-monthly':      'Monthly Digest',
  'ai-monthly-en':   'Monthly Digest',
};

const PER_PAGE = 10;
const content = document.getElementById('content');
const breadcrumb = document.getElementById('breadcrumb');
const searchInput = document.getElementById('search-input');

let DATES = [];
const mdCache = new Map();

// ── Helpers ──
function fmtDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function primaryReport(reports) {
  if (reports.includes('ai-digest')) return 'ai-digest';
  return reports.find(r => !r.endsWith('-en')) || reports[0];
}

function reportLabel(r) {
  const base = LABELS[r] || r;
  return r.endsWith('-en') ? `${base} (EN)` : base;
}

function dayTitle(entry) {
  return `${LABELS[primaryReport(entry.reports)] || 'Digest'} — ${entry.date}`;
}

async function fetchMd(date, report) {
  const key = `${date}/${report}`;
  if (mdCache.has(key)) return mdCache.get(key);
  let res;
  // Retry transient network failures (e.g. a cold CDN edge) before giving up.
  for (let attempt = 0; ; attempt++) {
    try {
      res = await fetch(`./digests/${key}.md`);
      break;
    } catch (netErr) {
      if (attempt >= 2) throw netErr;
      await new Promise((r) => setTimeout(r, 300 * (attempt + 1)));
    }
  }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  mdCache.set(key, text);
  return text;
}

function stripMd(raw) {
  return raw
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^[\s|:-]+$/gm, ' ')
    .replace(/[*_`>|]/g, ' ')
    .replace(/^-{3,}\s*$/gm, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function setBreadcrumb(parts) {
  breadcrumb.innerHTML = '';
  parts.forEach((p, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '›';
      breadcrumb.appendChild(sep);
    }
    if (p.href !== undefined) {
      const a = document.createElement('a');
      a.href = p.href;
      a.textContent = p.text;
      breadcrumb.appendChild(a);
    } else {
      const s = document.createElement('span');
      s.textContent = p.text;
      breadcrumb.appendChild(s);
    }
  });
}

function closeSidebar() { document.body.classList.remove('sidebar-open'); }

// ── Home view (post list) ──
let homePage = 1;
let searchFilter = null; // Set<date> | null

function visibleDates() {
  return searchFilter ? DATES.filter(d => searchFilter.has(d.date)) : DATES;
}

function renderHome(page = homePage) {
  const list = visibleDates();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  homePage = Math.min(Math.max(1, page), pages);
  const slice = list.slice((homePage - 1) * PER_PAGE, homePage * PER_PAGE);

  setBreadcrumb([{ text: 'Home' }]);
  document.getElementById('nav-home').classList.add('active');

  const wrap = document.createElement('div');
  wrap.id = 'post-list';
  wrap.className = 'fade';

  const status = document.createElement('div');
  status.className = 'search-status';
  status.id = 'search-status';
  if (searchFilter) status.textContent = `${list.length} day(s) matched`;
  else if (searchPending) status.textContent = 'Building search index…';
  wrap.appendChild(status);

  if (!slice.length) {
    wrap.insertAdjacentHTML('beforeend', '<div class="msg"><div class="msg-icon">📡</div><div>No matching days</div></div>');
  }

  slice.forEach(entry => {
    const primary = primaryReport(entry.reports);
    const card = document.createElement('a');
    card.className = 'card-wrapper';
    card.href = `#${entry.date}/${primary}`;

    const cats = entry.reports.filter(r => !r.endsWith('-en')).map(r => r.replace(/^ai-/, '')).join(', ');
    card.innerHTML =
      '<div class="card-body">' +
        `<h1 class="card-title">${dayTitle(entry)}</h1>` +
        `<div class="card-text" data-excerpt="${entry.date}/${primary}">…</div>` +
        '<div class="post-meta">' +
          `<i class="far fa-calendar fa-fw"></i><span><time>${fmtDate(entry.date)}</time></span>` +
          `<i class="far fa-folder-open fa-fw"></i><span class="categories">${cats}</span>` +
        '</div>' +
      '</div>';
    wrap.appendChild(card);
  });

  // Pagination
  if (pages > 1) {
    const ul = document.createElement('ul');
    ul.className = 'pagination';
    const mk = (label, target, opts = {}) => {
      const li = document.createElement('li');
      li.className = 'page-item' + (opts.active ? ' active' : '') + (opts.disabled ? ' disabled' : '');
      const btn = document.createElement('button');
      btn.className = 'page-link';
      btn.innerHTML = label;
      if (!opts.disabled && target) btn.onclick = () => { renderHome(target); window.scrollTo(0, 0); };
      li.appendChild(btn);
      return li;
    };
    ul.appendChild(mk('<i class="fas fa-angle-left"></i>', homePage - 1, { disabled: homePage === 1 }));
    const nums = new Set([1, pages, homePage - 1, homePage, homePage + 1]);
    let prev = 0;
    [...nums].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b).forEach(n => {
      if (n - prev > 1) ul.appendChild(mk('…', null, { disabled: true }));
      ul.appendChild(mk(String(n), n, { active: n === homePage }));
      prev = n;
    });
    ul.appendChild(mk('<i class="fas fa-angle-right"></i>', homePage + 1, { disabled: homePage === pages }));
    wrap.appendChild(ul);
  }

  content.innerHTML = '';
  content.appendChild(wrap);

  // Fill excerpts lazily
  wrap.querySelectorAll('[data-excerpt]').forEach(async (el) => {
    const [date, report] = el.dataset.excerpt.split('/');
    try {
      const raw = await fetchMd(date, report);
      el.textContent = stripMd(raw).slice(0, 220);
    } catch { el.textContent = ''; }
  });
}

// ── Day (post) view ──
let currentKey = null;

async function renderDay(date, report) {
  const entry = DATES.find(d => d.date === date);
  if (!entry) { renderHome(1); return; }
  if (!entry.reports.includes(report)) report = primaryReport(entry.reports);
  const key = `${date}/${report}`;
  currentKey = key;

  document.getElementById('nav-home').classList.remove('active');
  setBreadcrumb([{ text: 'Home', href: '#' }, { text: fmtDate(date) }]);
  closeSidebar();

  const view = document.createElement('div');
  view.id = 'post-view';
  view.className = 'fade';
  view.innerHTML =
    `<h1 class="post-title">${reportLabel(report)} — ${date}</h1>` +
    '<div class="post-desc">' +
      `<i class="far fa-calendar fa-fw"></i>Posted <time>${fmtDate(date)}</time>` +
      ` &nbsp;·&nbsp; ${entry.reports.length} report${entry.reports.length > 1 ? 's' : ''} this day` +
    '</div>';

  const tabs = document.createElement('div');
  tabs.className = 'report-tabs';
  entry.reports.forEach(r => {
    const b = document.createElement('button');
    b.className = 'report-tab' + (r === report ? ' active' : '');
    b.textContent = reportLabel(r);
    b.onclick = () => { if (r !== report) location.hash = `${date}/${r}`; };
    tabs.appendChild(b);
  });
  view.appendChild(tabs);

  const body = document.createElement('div');
  body.className = 'post-content';
  body.innerHTML = '<div class="msg"><div class="msg-icon">⏳</div><div>Loading…</div></div>';
  view.appendChild(body);

  content.innerHTML = '';
  content.appendChild(view);
  window.scrollTo(0, 0);

  try {
    const raw = await fetchMd(date, report);
    if (currentKey !== key) return; // user navigated away mid-fetch
    body.innerHTML = renderMarkdown(raw);
    // wrap tables for horizontal scroll on narrow screens
    body.querySelectorAll('table').forEach(t => {
      const w = document.createElement('div');
      w.className = 'table-wrap';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  } catch (e) {
    body.innerHTML = `<div class="msg"><div class="msg-icon">⚠️</div><div>Failed to load: ${e.message}</div></div>`;
  }
}

// ── Routing ──
function route() {
  const [date, report] = location.hash.slice(1).split('/');
  if (/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    renderDay(date, report || '');
  } else {
    currentKey = null;
    renderHome(homePage);
  }
}
window.addEventListener('hashchange', route);

// ── Search (full-text across all reports) ──
let searchIndex = null;
let searchPending = true;
let searchDebounce = null;

async function buildSearchIndex(dates) {
  const index = new Map();
  dates.forEach(({ date }) => index.set(date, ''));

  // Drain with a small worker pool so we never flood the browser's connection
  // pool (a fetch storm here was starving the primary content fetch).
  const tasks = [];
  dates.forEach(({ date, reports }) => {
    reports.forEach((report) => tasks.push({ date, report }));
  });

  const chunks = new Map(dates.map(({ date }) => [date, []]));
  let cursor = 0;
  const worker = async () => {
    while (cursor < tasks.length) {
      const { date, report } = tasks[cursor++];
      try {
        const res = await fetch(`./digests/${date}/${report}.md`);
        if (res.ok) chunks.get(date).push(await res.text());
      } catch {
        /* ignore — missing report just won't be searchable */
      }
    }
  };
  const POOL = 6;
  await Promise.all(Array.from({ length: POOL }, worker));

  chunks.forEach((arr, date) => index.set(date, arr.join('\n').toLowerCase()));
  return index;
}

function applySearch() {
  const needle = searchInput.value.trim().toLowerCase();
  if (!needle) {
    searchFilter = null;
  } else if (searchIndex) {
    searchFilter = new Set(DATES.filter(d => (searchIndex.get(d.date) || '').includes(needle)).map(d => d.date));
  } else {
    searchFilter = null; // index still building
  }
  // Searching always brings you to the (filtered) home list
  if (location.hash && location.hash.length > 1 && needle) history.pushState(null, '', '#');
  renderHome(1);
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(applySearch, 150);
});

// ── Sidebar (mobile) ──
document.getElementById('sidebar-trigger').onclick = () => document.body.classList.add('sidebar-open');
document.getElementById('mask').onclick = closeSidebar;

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');
    DATES = dates;

    route();

    // Index AFTER the first view renders, so the fetch storm never competes
    // with the primary content fetch.
    buildSearchIndex(dates).then((index) => {
      searchIndex = index;
      searchPending = false;
      const status = document.getElementById('search-status');
      if (status && !searchInput.value.trim()) status.textContent = '';
      if (searchInput.value.trim()) applySearch();
    });
  } catch (e) {
    content.innerHTML = '<div class="msg"><div class="msg-icon">📡</div><div>Could not load manifest.json</div></div>';
  }
})();
</script>
</body>
